# ---------------------------------------------
# Simple项目属性配置
# -----------------------------------------------

# 应用的主窗口限定名，同时主窗口所在包名也是应用包名
# 例如限定名：aaa.bbb.主窗口 那应用包名：aaa.bbb
main={$主窗口限定名}

# 应用名称
# 缺省值：MyApp
name={$应用名称}

# 应用的版本号，注意必须为整数值
# 缺省值：1
# 可选值：>1 (正整数)
version.code=1

# 应用的版本名
# 缺省值：1.0
version.name=1.0

# 应用图标，资源目录下的图标路径
# 缺省值：@drawable/icon，编译器自动检验写入缺省“icon.png”
# 举栗子：“res/drawable/es4a.png”为应用图标"@drawable/es4a"
icon=@drawable/icon

# 应用的屏幕方向
# 可选值：默认=unspecified 橫向=landscape 纵向=portrait
# 缺省值：unspecified
orientation=unspecified

# 应用的主题风格，注意对应的Android运行类库。
# 组合值：白色=+.Light 无标题=+.NoActionBar 全屏=+.Fullscreen 等... (详细请参考相关文档)
# 缺省值：缺省或为空文本，将将使用系统默认主题
# 举栗子：无标题栏白色的Material主题“@android:style/Theme.Material.Light.NoActionBar”
theme=

# 应用的签名证书文件路径
# 缺省值：缺省或为空文本，将使用调试证书
key.location=

# 应用的签名证书别名
# 缺省值：缺省为空文本，仅在指定 key.location 时生效
key.alias=

# 应用的签名证书密码
# 缺省值：缺省为空文本，仅在指定 key.location 时生效
key.password=

# 资产目录
# 缺省值：./assets
assets=./assets

# 资源目录
# 缺省值：./res
res=./res

# 源代码(Simple)目录
# 缺省值：./src
source=./src

# 构建目录
# 缺省值：./build
build=./build

# 清单宏
# 格式：对象名.宏名=宏值
